<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontrola aktualizacji – Łowiska Mazowsze</title><meta http-equiv="Cache-Control" content="no-cache"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{color-scheme:dark}body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1119;color:#eaf3f8;margin:0;padding:20px}main{max-width:640px;margin:auto}h1{font-size:23px}.info{color:#afbfce;font-size:14px}a{color:#9adcf9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.card{border:1px solid #465366;padding:18px;border-radius:15px;background:#1b2633}.hour{font-weight:800;font-size:22px}.status{font-size:15px;margin-top:8px}.ok{color:#6addaa}.miss{color:#ffa4af}.wait{color:#ffdc7c}.detail{font-size:12px;color:#b9c9d5;margin-top:8px}.links{margin:20px 0}</style></head><body><main><h1>Łowiska Mazowsze – kontrola aktualizacji</h1><p class="info" id="date">Sprawdzanie dnia…</p><div class="grid" id="slots"></div><p class="info" id="note">Ładowanie rejestru rzeczywistych publikacji…</p><div class="links"><a href="index.html">Raport bieżący</a></div><script>
const slots=["05","10","12","14"];
const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Warsaw",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const localHour=Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Warsaw",hour:"2-digit",hourCycle:"h23"}).format(new Date()));
document.getElementById("date").textContent="Dziś: "+today+" (Europe/Warsaw)";
async function check(){
 let j={};try{let r=await fetch("aktualizacje.json?t="+Date.now(),{cache:"no-store"});if(r.ok)j=await r.json();}catch(e){}
 const entries=(j.data===today&&j.automatyczne)||{};
 document.getElementById("slots").innerHTML=slots.map(h=>{
 const done=entries[h],upcoming=localHour<Number(h),state=done?"Wykonano":upcoming?"Oczekuje":"Brak potwierdzenia",cls=done?"ok":upcoming?"wait":"miss";
 return '<div class="card"><div class="hour">'+h+':00</div><div class="status '+cls+'">'+state+'</div><div class="detail">'+(done?"Publikacja: "+done:"Brak zapisu udanej publikacji automatycznej")+'</div></div>';
 }).join("");
 document.getElementById("note").textContent="Zielony status oznacza zapisaną udaną aktualizację automatyczną, nie ręczną. Brak potwierdzenia nie oznacza, że sama prognoza jest niedostępna. Zapis pojawia się po udanym wygenerowaniu i publikacji raportu.";
}
check();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
</script></main></body></html>
